<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🐹 햄스터봇 레이싱 랭킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-badge">🐹</span>
      <h1>햄스터봇 레이싱 랭킹</h1>
    </div>
    <div class="header-right">
      <div class="status-line">
        <span class="status-pill"><span id="liveDot" class="live-dot"></span>실시간 연동</span>
        <span class="status-pill">참가 <strong id="totalCount">0</strong>명</span>
        <span class="status-pill">업데이트 <span id="lastSync">-</span></span>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드 전환">
        <span class="toggle-track"><span class="toggle-thumb">☀️</span></span>
      </button>
    </div>
  </header>

  <main>
    <div class="fold">
      <section class="card podium-section" aria-label="1위부터 3위">
        <h2><span class="h2-icon icon-gold">🏆</span>1위 ~ 3위</h2>
        <div id="podium" class="podium"></div>
      </section>

      <section class="card" aria-label="4위부터 10위">
        <h2><span class="h2-icon icon-mid">🎖️</span>4위 ~ 10위</h2>
        <div id="midList"></div>
      </section>
    </div>

    <section id="restSection" class="card" style="display:none; margin-top:20px;" aria-label="11위 이하">
      <h2><span class="h2-icon icon-rest">📋</span>11위 이하</h2>
      <div id="restList"></div>
    </section>

    <div id="emptyState" class="empty-state">
      <div class="big">🐹</div>
      <div>아직 기록이 없습니다. 첫 번째 도전자가 되어보세요!</div>
    </div>
  </main>

  <script type="module" src="./assets/ranking.js"></script>
</body>
</html>
