name: Deploy GitHub Pages

on:
  # 기록 데이터(admin이 커밋)와 사이트 코드가 모두 이 브랜치에 있다. 다른 브랜치까지 배포하면
  # 그 브랜치의 오래된 기록/코드로 사이트가 덮어써지므로 이 브랜치 하나만 배포한다.
  push:
    branches:
      - claude/gracious-sagan-mzkdnd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
